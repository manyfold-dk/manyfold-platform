# Website backend Deployment. The cloud overlay sets the image tag and the cluster's own
# settings: replicas, spreading, the pull secret and the production environment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-backend
  namespace: website
  labels:
    app: website-backend
    app.kubernetes.io/name: website-backend
    app.kubernetes.io/part-of: manyfold-platform
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: website-backend
  template:
    metadata:
      labels:
        app: website-backend
    spec:
      serviceAccountName: website-backend
      # PodSecurity restricted.
      # uid 185 is the numeric USER baked into the image (apps/website/Dockerfile) -- declaring it lets the
      # kubelet verify non-root; the container already ran as 185 before this change.
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/manyfold-dk/manyfold-platform/website-backend
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # In-cluster addresses (application.properties defaults are local development).
            - name: MANYFOLD_STATUS_BACKEND_URL
              value: http://website-backend.website.svc:8080
            - name: MANYFOLD_PROMETHEUS_URL
              value: http://prometheus-operated.observability.svc:9090
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observability.svc:4317
            - name: QUARKUS_REDIS_HOSTS
              value: redis://redis.platform-ops.svc:6379
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
