apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Website base resources
#
# Shared resources used by both local and cloud environments, including the backend
# Deployment. Environment-specific settings and routes are in the overlays.

resources:
  - namespace.yaml
  - rbac.yaml
  - backend-service.yaml
  - backend-deployment.yaml
