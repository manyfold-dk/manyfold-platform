# Test configuration
quarkus.application.version=test

# Disable OpenTelemetry in tests
quarkus.otel.sdk.disabled=true

# Disable scheduled tasks in tests (AutoRemediationService makes K8s API calls)
quarkus.scheduler.enabled=false

# Mock Prometheus URL for tests
manyfold.prometheus.url=http://localhost:9090

# Webhook bearer token for the machine webhooks (Alertmanager, CI)
manyfold.webhook.token=test-webhook-token

# The certificate the status page reports on (the mock answers for any target)
manyfold.status.public-tls-target=www.example.com:443
