# Application metadata
quarkus.application.name=website-backend
quarkus.application.version=0.1.0-SNAPSHOT

# HTTP configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.enable-compression=true

# CORS configuration for frontend dev server (dev profile only)
# Scoped to %dev to avoid exposing CORS in production
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=accept,authorization,content-type

# Health checks
quarkus.smallrye-health.root-path=/health

# Probe decoupling (spec B2, 2026-07-07): extension clients must never fail
# kubelet probes. Disabling the auto-registered extension health checks drops
# the Redis and Kubernetes-client readiness checks (the only two present); the
# explicit process-up Liveness check keeps /health/live meaningful. Redis /
# Kubernetes / Prometheus reachability is reported via the informational
# /api/v1/health/deep endpoint instead.
quarkus.smallrye-health.extensions.enabled=false

# Role-gated endpoints (remediation). The homepage oauth2-proxy forwards the user's access
# token in X-Forwarded-Access-Token; the backend verifies its signature against Keycloak and
# reads the realm roles. Only annotated endpoints authenticate (proactive auth off), so an
# expired or absent token never breaks an ordinary page. The tenant is off unless the
# deployment configures it (issuer, JWKS location, expected client): with it off, every
# @RolesAllowed endpoint answers 401, so a missing configuration fails closed.
quarkus.http.auth.proactive=false
quarkus.oidc.tenant-enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.token.header=X-Forwarded-Access-Token
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Only tokens issued to the expected client (the proxy in front of this backend) count; the
# default names no real client, so an unconfigured deployment accepts none.
quarkus.oidc.token.required-claims.azp=${manyfold.oidc.expected-client:unconfigured}
quarkus.keycloak.devservices.enabled=false

# OpenAPI / Swagger
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Metrics
quarkus.micrometer.export.prometheus.path=/metrics
# The frontend's build output has content-hashed file names; recording each as its own
# `uri` tag would add a set of series with every release. They share one tag instead.
quarkus.micrometer.binder.http-server.match-patterns=/assets/.+=/assets/*

# Addresses of the services this backend talks to. The defaults are local development
# (a port-forward or a local process); each cluster's overlay sets its own in-cluster
# addresses through the environment (MANYFOLD_STATUS_BACKEND_URL, MANYFOLD_PROMETHEUS_URL,
# QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT, QUARKUS_REDIS_HOSTS), and optionally
# MANYFOLD_STATUS_PUBLIC_TLS_TARGET and MANYFOLD_HEALTH_POD_APPS.

# Status endpoint configuration
manyfold.status.backend-url=http://localhost:8080

# How long the public status endpoints serve a computed answer before refreshing
# it. These are what keep the load on Prometheus and the Kubernetes API a
# function of time rather than of how much traffic manyfold.dk/status receives:
# one refresh per interval is the ceiling, whatever arrives at the front door.
# Both are well under the 30 second poll on the page, so a visitor still sees
# movement. The history series are cached far longer because the probes behind
# them only run every two and five minutes.
manyfold.health.cache-ttl-seconds=15
manyfold.status.cache-ttl-seconds=15
manyfold.status.history-cache-ttl-seconds=120

# Prometheus configuration
manyfold.prometheus.url=http://localhost:9090

# OpenTelemetry Tracing
# Export traces to Alloy via OTLP/gRPC
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.traces.sampler=always_on
quarkus.otel.resource.attributes=deployment.environment=local,service.namespace=website

# Disable tracing in dev mode (no collector running locally)
%dev.quarkus.otel.sdk.disabled=true

# Redis (event publishing to Slack bot via Redis Streams)
quarkus.redis.hosts=redis://localhost:6379

# Logging
quarkus.log.level=INFO
quarkus.log.category."dk.manyfold".level=DEBUG

# Native build configuration
quarkus.native.resources.includes=META-INF/resources/**
