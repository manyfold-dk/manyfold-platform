# Production configuration, loaded after app-config.yaml by the image's CMD.
#
# Every installation value is an environment variable. The installation mounts a
# third file, app-config.instance.yaml, and appends it with
# `--config /app/instance/app-config.instance.yaml`; that file carries what is
# not a secret (the public base URL, the OIDC metadata URL, more catalog
# locations). See README.md#configuration.

app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: ${APP_BASE_URL}

backend:
  baseUrl: ${APP_BASE_URL}
  listen:
    port: 7007
  cors:
    origin: ${APP_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

auth:
  environment: production
  # The auth backend installs its session middleware only with a secret; the OIDC
  # login needs a session to carry its state between /start and the callback.
  session:
    secret: ${AUTH_SESSION_SECRET}
  # app-config.yaml enables the guest provider for local development; the
  # backend does not load its module outside NODE_ENV=development.
  providers:
    oidc:
      production:
        metadataUrl: ${AUTH_OIDC_METADATA_URL}
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        prompt: auto
        signIn:
          resolvers:
            - resolver: emailMatchingUserEntityProfileEmail
              dangerouslyAllowSignInWithoutUserInCatalog: true

catalog:
  rules:
    - allow:
        [Component, System, API, Resource, Location, Domain, Group, User, Template]
  # Replaces the example locations of app-config.yaml.
  locations:
    - type: url
      target: https://github.com/manyfold-dk/manyfold-platform/blob/main/catalog/all.yaml
    - type: url
      target: https://github.com/manyfold-dk/estate-baseline/blob/main/catalog-info.yaml

# TechDocs: the backend builds an entity's docs on first view with mkdocs inside the
# image (Dockerfile, requirements.txt) and publishes the site to an S3-compatible
# bucket, which survives a Pod replacement. The backend builds rather than CI, because
# publishing from CI would need the bucket's credentials in public repositories.
# The installation provides the bucket and its credentials as the Secret
# backstage-techdocs-bucket (base/deployment.yaml).
techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: awsS3
    awsS3:
      bucketName: ${TECHDOCS_BUCKET}
      endpoint: ${TECHDOCS_ENDPOINT}
      region: ${TECHDOCS_REGION}
      s3ForcePathStyle: true
      credentials:
        accessKeyId: ${TECHDOCS_ACCESS_KEY_ID}
        secretAccessKey: ${TECHDOCS_SECRET_ACCESS_KEY}

# The Baseline conformance card's data (plugins/conformance-backend). The installation
# sets conformance.sourceUrl in app-config.instance.yaml; unset, the card reports that
# the source is not configured. See README.md#baseline-conformance-card.
