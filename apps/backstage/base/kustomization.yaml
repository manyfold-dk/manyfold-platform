apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Backstage base: the developer portal and its cache database. The installation overlay
# pins the image tag, mounts app-config.instance.yaml, provides the Secrets
# backstage-postgres, backstage-github-token, backstage-oidc and the pull secret
# ghcr-credentials, and adds the route.

labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: manyfold-platform

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - service.yaml
  - deployment.yaml
  - postgres.yaml
