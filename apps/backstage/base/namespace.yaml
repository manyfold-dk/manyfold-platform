apiVersion: v1
kind: Namespace
metadata:
  name: backstage
  labels:
    app.kubernetes.io/part-of: manyfold-platform
    # PodSecurity: advisory. Every workload this base declares is restricted-compliant.
    # warn/audit makes a violation visible without blocking it; the installation adds
    # `enforce`.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
