quarkus.application.name=accounting-mcp
quarkus.http.port=8080
# Bound multipart uploads before Quarkus passes the staged request to the REST resource. 6,100 KiB
# leaves ample room around DineroWriter's exact 6,000,000-byte file cap for multipart headers and
# boundaries, while preventing an unbounded request from reaching application-level buffering.
quarkus.http.limits.max-body-size=6100K

# Behind the shared Cilium gateway (TLS terminated upstream): trust X-Forwarded-* so OIDC
# discovery / RFC 9728 metadata build https URLs with the external host
# rather than the internal http://host:8080. Safe here -- the pod is only reachable via the trusted
# gateway under default-deny ingress, never directly, so forwarded headers cannot be spoofed.
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.enable-forwarded-host=true
%prod.quarkus.http.proxy.enable-forwarded-prefix=true

# --- Write ledger + audit datasource (ADR-0043) ---
# Reads are transient passthrough (no persistence); only the write tools persist the durable
# integration_write ledger. Hibernate + Flyway connect at startup, so a datasource is required for
# the pod to become Ready even while the service is inert (no Dinero creds).
quarkus.datasource.db-kind=postgresql
# Production: the URL whole (DB_URL), or its parts: DB_HOST and DB_NAME, and DB_PORT (default
# 5432). Dev mode takes DB_URL only, so that an unset one leaves the database to Dev Services.
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
%prod.quarkus.datasource.username=${DB_USERNAME:accounting}
%prod.quarkus.datasource.password=${DB_PASSWORD:}
%dev.quarkus.datasource.jdbc.url=${DB_URL:}
%dev.quarkus.datasource.username=${DB_USERNAME:}
%dev.quarkus.datasource.password=${DB_PASSWORD:}
quarkus.flyway.migrate-at-start=true

# --- Default OIDC tenant: bearer validation for the internal REST passthrough (ADR-0043) ---
# service mode: a bearer is validated if present; the in-code IntegrationGateway gate
# (integration-reader / integration-writer via IdentityResolver) authorizes. No interactive login.
# The issuer is instance configuration with no default: prod refuses to start without it.
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.application-type=service
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Only tokens minted for this service (review finding M2). Both clients that call it -- the PKCE
# connector and the agent-api direct grant -- add aud=accounting-mcp through an audience mapper,
# as the /mcp tenant below already requires. Env-overridable like that one.
quarkus.oidc.token.audience=${OIDC_TOKEN_AUDIENCE:accounting-mcp}

# --- Agent APIs: bearer-only OIDC tenant for /mcp and receipt uploads (ADR-0043) ---
# The agent-facing routes use a named OIDC tenant in `service` (bearer) mode, so a request with no or
# invalid token gets a 401 (never a 302 login), validated against the manyfold realm and gated in-code
# on integration-reader (reads) / integration-writer (writes). resource-metadata publishes RFC 9728
# protected-resource metadata + the WWW-Authenticate hint so Claude/Cowork discovers the Keycloak
# authorization server and walks OAuth 2.1 Authorization Code + PKCE.
quarkus.oidc.mcp.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.mcp.application-type=service
quarkus.oidc.mcp.tenant-paths=/mcp,/mcp/*,/api/integrations/dinero/files
quarkus.oidc.mcp.roles.source=accesstoken
quarkus.oidc.mcp.roles.role-claim-path=realm_access/roles
# Reject tokens not minted for this resource (the Keycloak audience mapper sets aud=accounting-mcp on
# the connector client). Env-overridable so the operator can align it with the registered client.
quarkus.oidc.mcp.token.audience=${MCP_TOKEN_AUDIENCE:accounting-mcp}
quarkus.oidc.mcp.resource-metadata.enabled=true
# Advertise the standard `openid` scope in the protected-resource metadata (RFC 9728) so the MCP
# client requests a scope Keycloak accepts; the integration roles ride in realm_access regardless.
quarkus.oidc.mcp.resource-metadata.scopes=openid

# Prod: require authentication on everything except health/metrics and the OAuth discovery
# well-known paths (the MCP client probes those during connect; a 302 into a login would derail
# RFC 9728 discovery). This is what makes an unauthenticated /mcp return 401 + WWW-Authenticate.
%prod.quarkus.http.auth.permission.authenticated.paths=/*
%prod.quarkus.http.auth.permission.authenticated.policy=authenticated
%prod.quarkus.http.auth.permission.public.paths=/q/health,/q/health/*,/q/metrics,/.well-known/oauth-protected-resource,/.well-known/oauth-protected-resource/*,/.well-known/oauth-authorization-server,/.well-known/oauth-authorization-server/*,/.well-known/openid-configuration,/.well-known/openid-configuration/*
%prod.quarkus.http.auth.permission.public.policy=permit

# Dev: no real IdP -- disable OIDC; DevIdentityAugmentor turns the anonymous caller into this config
# identity (a real SecurityIdentity, so the @RolesAllowed write tools accept it too) and the
# passthrough + MCP tools are reachable locally against live Dinero creds from the gitignored root
# .env.cloud (DINERO_*). DevIdentityGuard refuses a production start with the flag set.
%dev.quarkus.oidc.enabled=false
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/dev
%dev.quarkus.oidc.mcp.auth-server-url=http://localhost:8180/realms/dev
%dev.accounting.dev.identity.enabled=true
%dev.accounting.dev.identity.sub=dev-agent
%dev.accounting.dev.identity.roles=integration-reader,integration-writer

# --- Dinero personal integration (ADR-0043) ---
# Personal-integration auth: POST {auth-url} with HTTP Basic base64(client_id:client_secret) and a
# form body grant_type=password&scope=read write&username={api-key}&password={api-key}; the bearer is
# fetched and injected server-side by DineroProxyClient/DineroTokenProvider. Org-scoped paths carry
# the OrganizationId (FirmaId), injected by substituting the {organizationId} placeholder. Secret
# values come from the env (12-factor): prod via the SOPS-encrypted dinero-credentials secret,
# local/cloud dev via the gitignored root .env.cloud. Blank client-id/secret/api-key/organization-id
# keep the integration inert (503), so the service ships dark until the credentials are present.
accounting.integrations.dinero.base-url=${DINERO_BASE_URL:https://api.dinero.dk}
accounting.integrations.dinero.auth-url=${DINERO_AUTH_URL:https://authz.dinero.dk/dineroapi/oauth/token}
accounting.integrations.dinero.client-id=${DINERO_CLIENT_ID:}
accounting.integrations.dinero.client-secret=${DINERO_CLIENT_SECRET:}
accounting.integrations.dinero.api-key=${DINERO_API_KEY:}
accounting.integrations.dinero.organization-id=${DINERO_ORGANIZATION_ID:}
accounting.integrations.dinero.max-response-bytes=10485760
# Pace below Dinero's 60 req/min personal-integration cap so we never trip the vendor 429.
accounting.integrations.dinero.rate-limit-per-minute=55

# --- Test profile: @TestSecurity supplies identities; pin Dinero at a WireMock and disable the
# named mcp tenant so it does not try to discover a (non-existent) Keycloak at startup. ---
%test.quarkus.oidc.mcp.tenant-enabled=false
%test.quarkus.oidc.auth-server-url=http://localhost:8180/realms/test
%test.quarkus.oidc.mcp.auth-server-url=http://localhost:8180/realms/test
%test.quarkus.oidc.client-id=test
%test.quarkus.oidc.application-type=service
%test.accounting.integrations.dinero.base-url=http://localhost:8091
%test.accounting.integrations.dinero.auth-url=http://localhost:8091/oauth/token
%test.accounting.integrations.dinero.client-id=test-dinero-id
%test.accounting.integrations.dinero.client-secret=test-dinero-secret
%test.accounting.integrations.dinero.api-key=test-api-key
%test.accounting.integrations.dinero.organization-id=999888
%test.accounting.integrations.dinero.max-response-bytes=1024
%test.accounting.integrations.dinero.rate-limit-per-minute=1000
%test.quarkus.scheduler.enabled=false
