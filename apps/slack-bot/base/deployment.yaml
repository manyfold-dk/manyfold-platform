apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-bot
  namespace: platform-ops
  labels:
    app: slack-bot
    app.kubernetes.io/name: slack-bot
    app.kubernetes.io/part-of: manyfold-platform
spec:
  replicas: 1
  # One bot at a time, also during a rollout: two pods would each hold a Socket Mode connection
  # and could handle clicks on the same card, which the ops decision record cannot fully order.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: slack-bot
  template:
    metadata:
      labels:
        app: slack-bot
        app.kubernetes.io/name: slack-bot
        app.kubernetes.io/part-of: manyfold-platform
    spec:
      serviceAccountName: slack-bot
      containers:
        - name: slack-bot
          image: ghcr.io/manyfold-dk/manyfold-platform/slack-bot
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack-bot-credentials
                  key: bot-token
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack-bot-credentials
                  key: app-token
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: slack-bot-credentials
                  key: signing-secret
            - name: REDIS_URL
              value: redis://redis.platform-ops.svc:6379
            - name: BACKEND_URL
              value: http://website-backend.website.svc:8080
            - name: GRAFANA_BASE_URL
              value: http://localhost/grafana
            - name: TEKTON_DASHBOARD_URL
              value: http://localhost/tekton
            - name: ARGOCD_URL
              value: https://localhost:30443
            - name: CONSUMERS_ENABLED
              value: "false"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
