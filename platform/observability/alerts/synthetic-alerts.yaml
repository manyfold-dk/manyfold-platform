apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: synthetic-alerts
  namespace: observability
  labels:
    app: kube-prometheus-stack
    release: observability
spec:
  groups:
    - name: synthetic.availability
      rules:
        - alert: SyntheticFrontDownExternal
          expr: min by (front) (synthetic_check_up{vantage="external"}) == 0
          for: 4m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.front }} is DOWN from the external vantage"
            description: "External probe reports {{ $labels.front }} down for >4m. User-facing outage likely."
        - alert: SyntheticFrontDownInternal
          expr: min by (front) (probe_success{job=~"synthetic.*"}) == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.front }} failing in-cluster probe"
        # Only login journeys (journey="login") carry a meaningful
        # synthetic_login_success; the www smoke always reports 0 (no login).
        # Guard on up==1 so this is a differentiated "login regression while the
        # site is up" signal and does not double-fire during a full outage
        # (which SyntheticFrontDown* already cover). ignoring(__name__) matches
        # the two metrics on their shared front/journey/vantage/tenant labels.
        - alert: SyntheticLoginFailing
          expr: |
            max by (front) (
              synthetic_login_success{journey="login"} == 0
              and ignoring(__name__)
              synthetic_check_up{journey="login"} == 1
            )
          for: 12m
          labels: { severity: critical }
          annotations:
            summary: "Login journey for {{ $labels.front }} is failing (site up, login broken)"
        # Group by front+journey+vantage so a fresh external edge push cannot
        # mask a stalled internal journey for the same front (each producer is
        # tracked independently). The Pushgateway keeps its groups in memory, so a
        # restart drops the series of a stalled producer; max_over_time keeps the
        # last value visible for six hours, long enough for this alert to fire.
        - alert: SyntheticStale
          expr: time() - max by (front, journey, vantage) (max_over_time(synthetic_run_timestamp_seconds[6h])) > 1800
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "No fresh synthetic result for {{ $labels.front }} ({{ $labels.journey }}/{{ $labels.vantage }}) in 30m (runner stalled?)"
        # Every producer silent for longer than SyntheticStale's six-hour window,
        # or none ever pushed since the Pushgateway started.
        - alert: SyntheticNoResults
          expr: absent(synthetic_run_timestamp_seconds)
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "No synthetic results at all in the Pushgateway for 30m (runners and edge probe silent?)"
        # Use the dedicated tls_connect probe (direct per-front handshake);
        # the http_2xx probe follows redirects and would report the auth
        # endpoint's cert under a gated front.
        - alert: SyntheticCertExpiringSoon
          expr: (min by (front) (probe_ssl_earliest_cert_expiry{job="synthetic-tls"}) - time()) / 86400 < 14
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "TLS cert for {{ $labels.front }} expires in <14 days"
