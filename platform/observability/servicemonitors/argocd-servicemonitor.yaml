# ServiceMonitor for ArgoCD Application Controller metrics
#
# Scrapes metrics from ArgoCD Application Controller:
# - argocd_app_info (application status)
# - argocd_app_sync_total (sync operations)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd
  namespace: observability
  labels:
    release: observability
    app: argocd
spec:
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      # An argocd_app_* series describes an Application, but the target labels it with
      # the controller's pod and container, and alerts on it inherited them. Cleared on
      # those families only; the controller's own metrics keep its pod. The regex does
      # not capture, so an empty replacement and the default "$1" both clear the label.
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: argocd_app_.+
          targetLabel: pod
          replacement: ""
          action: replace
        - sourceLabels: [__name__]
          regex: argocd_app_.+
          targetLabel: container
          replacement: ""
          action: replace
---
# ServiceMonitor for ArgoCD Server metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-server
  namespace: observability
  labels:
    release: observability
    app: argocd-server
spec:
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server-metrics
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
