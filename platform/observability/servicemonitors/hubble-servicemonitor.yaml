# ServiceMonitor for Hubble metrics
#
# Scrapes network observability metrics from Cilium/Hubble
# Metrics include: dns, drop, tcp, flow, icmp, http
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hubble
  namespace: observability
  labels:
    release: observability
    app: hubble
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      k8s-app: hubble
  endpoints:
    - port: hubble-metrics
      interval: 30s
      scrapeTimeout: 10s
