apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: platform-ops
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: manyfold-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: manyfold-platform
    spec:
      # PodSecurity restricted.
      # redis:7-alpine defaults to uid 0, but the image already carries a `redis` account at
      # uid 999 and owns /data as 999:1000, so no chown is needed -- verified by running the
      # image and reading /etc/passwd plus `ls -ldn /data`. Running as 999 makes
      # docker-entrypoint.sh skip its gosu step and exec redis-server directly.
      # No fsGroup: this Redis is the event bus and has no persistent volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
              name: redis
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: platform-ops
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: manyfold-platform
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: redis
      name: redis
