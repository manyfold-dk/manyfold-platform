# Pull-through cache for ghcr.io (GitHub Container Registry)
#
# Caches images from ghcr.io to reduce external network traffic
# and speed up image pulls.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mirror-ghcr-io-cache
  namespace: registry-system
  labels:
    app.kubernetes.io/name: mirror-ghcr-io
    app.kubernetes.io/part-of: registry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirror-ghcr-io
  namespace: registry-system
  labels:
    app.kubernetes.io/name: mirror-ghcr-io
    app.kubernetes.io/part-of: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mirror-ghcr-io
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mirror-ghcr-io
        app.kubernetes.io/part-of: registry
    spec:
      # PodSecurity restricted.
      # registry:2 defaults to uid 0 and /var/lib/registry is root-owned, so the uid has to be
      # imposed and the existing volume made writable. uid 65534 (`nobody`) already exists in
      # the image. fsGroup is what re-groups the PVC's existing content; OnRootMismatch keeps
      # the recursive walk to the first mount instead of every start.
      # Verified by running registry:2 with this exact context: ready, 0 restarts, /v2/ -> 200.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: "https://ghcr.io"
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: cache
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: mirror-ghcr-io-cache
---
apiVersion: v1
kind: Service
metadata:
  name: mirror-ghcr-io
  namespace: registry-system
  labels:
    app.kubernetes.io/name: mirror-ghcr-io
    app.kubernetes.io/part-of: registry
spec:
  selector:
    app.kubernetes.io/name: mirror-ghcr-io
  ports:
    - name: http
      port: 5000
      targetPort: 5000
