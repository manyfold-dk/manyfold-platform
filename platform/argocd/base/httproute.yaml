# ArgoCD HTTPRoute (local)
#
# Routes /argocd/* to ArgoCD server.
# ArgoCD server handles the /argocd prefix natively
# (configured via server.rootpath in argocd-cmd-params-cm).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: main
      namespace: cilium-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /argocd
      backendRefs:
        - name: argocd-server
          port: 80
