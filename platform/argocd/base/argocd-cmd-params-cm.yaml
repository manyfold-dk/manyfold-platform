# ArgoCD Server Configuration for subpath routing
# Configures ArgoCD to run under /argocd path
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # Run ArgoCD server under /argocd subpath
  server.rootpath: /argocd
  # Disable TLS on the server (ingress handles TLS termination)
  server.insecure: "true"
