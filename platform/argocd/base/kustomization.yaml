apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Generic Argo CD configuration. An installation layers its own values on top in an
# overlay of its own (canonical URL, OIDC provider, RBAC policy); the cluster setup
# scripts apply that overlay, not this directory.
#
# KSOPS in the repo server is the component ../components/ksops: it patches the upstream
# repo-server Deployment, which this directory does not contain.
#
# No HTTPRoute. Which gateway, listener, hostname and paths expose the server is an
# installation decision, so the installation's overlay carries its routes. A route that
# names no hostname and no sectionName attaches to every listener of its gateway. The
# server serves under /argocd (server.rootpath in argocd-cmd-params-cm); ADR-0022 keeps
# the UI on a private gateway and exposes only the webhook path publicly.
resources:
  - argocd-cm.yaml
  - argocd-cmd-params-cm.yaml
