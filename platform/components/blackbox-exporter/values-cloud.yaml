# prometheus-blackbox-exporter (cloud) -- Layer A in-cluster probes (ADR-0036).
# Targets are wired via Probe CRDs, not a static ServiceMonitor. An installation adds
# modules that name its own hosts in a values file of its own (here:
# overlays/cloud/values.yaml).
#
# Pin the resource name so the Service is exactly
# prometheus-blackbox-exporter.observability.svc, which the Probe CRDs reference
# as prober.url (the ArgoCD app/Helm release is named "blackbox-exporter").
fullnameOverride: prometheus-blackbox-exporter
resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { memory: 64Mi }
config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        valid_status_codes: [200]
        method: GET
        fail_if_not_ssl: true
        preferred_ip_protocol: ip4
    # Asserts security headers are present
    http_security_headers:
      prober: http
      timeout: 10s
      http:
        valid_status_codes: [200, 302]
        preferred_ip_protocol: ip4
        fail_if_header_not_matches:
          - header: Strict-Transport-Security
            regexp: ".+"
    tls_connect:
      prober: tcp
      timeout: 10s
      tcp:
        preferred_ip_protocol: ip4
        tls: true
serviceMonitor:
  enabled: false   # targets are wired via Probe CRDs, not a static SM
