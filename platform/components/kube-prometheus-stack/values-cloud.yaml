# kube-prometheus-stack Cloud (Hetzner) Values
#
# Cloud-specific configuration:
# - 15-day retention (vs 2 days local)
# - Higher resources for production workloads
# - Grafana single sign-on through the identity provider (OpenID Connect)
# - Slack alerting via mounted secret
#
# The installation layers its own values on top (its hosts, the identity provider's
# URLs, node placement); here: overlays/cloud/values.yaml.

# Prometheus configuration
prometheus:
  prometheusSpec:
    retention: 15d
    # Hard size cap so the TSDB can never silently fill the PVC again. Time-based
    # retention alone does NOT bound disk usage -- on 2026-06-21 the 20Gi volume
    # filled with <15d of data, every WAL write started failing with "no space
    # left on device", and Prometheus stopped storing samples for ~3 days (all
    # dashboards blank + false KubeAPIDown/KubeControllerManagerDown/
    # KubeSchedulerDown criticals from absent(up==1)). Volume was expanded to
    # 40Gi; keep retentionSize ~80% of the PVC so blocks are dropped before the
    # disk fills. Whichever of retention/retentionSize hits first wins.
    retentionSize: 32GB
    routePrefix: /
    resources:
      limits:
        memory: 3Gi
        # Cap CPU so a WAL replay after an OOM/restart cannot consume every
        # spare core on the host. Without this, replay starved the node's
        # kubelet, every co-located pod failed liveness probes at once, and the
        # resulting restart storm produced the recurring cluster-wide alert
        # floods. 1500m leaves about 2.5 cores on a 4-core worker for the kubelet
        # and other pods while still giving replay plenty of headroom.
        cpu: 1500m
      requests:
        cpu: 200m
        memory: 1Gi
    # Scrape all ServiceMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Discover Probe CRDs across all namespaces (synthetic blackbox probes, ADR-0036)
    probeSelectorNilUsesHelmValues: false
    # An alert computed from node-exporter series carries the node-exporter pod, container
    # and namespace: the exporter's, not those of its subject, the node. The series keep
    # them, because the chart's node recording rules (node:node_num_cpu:sum and others)
    # join node-exporter series to kube_pod_info on (namespace, pod) to learn the node.
    # The alert sent to Alertmanager drops them, so nothing that acts on an alert's pod
    # (a restart, a link) targets the exporter; `instance` still names the target. Raw
    # Prometheus alert_relabel_configs: the chart copies this list into a Secret.
    additionalAlertRelabelConfigs:
      - source_labels: [job]
        regex: node-exporter
        target_label: pod
        replacement: ""
      - source_labels: [job]
        regex: node-exporter
        target_label: container
        replacement: ""
      - source_labels: [job]
        regex: node-exporter
        target_label: namespace
        replacement: ""
    # Persistent storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: hcloud-volumes
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              # Expanded 20Gi -> 40Gi on 2026-06-24 after the PVC filled (see the
              # retentionSize note above). The live PVC was grown online via
              # `kubectl patch pvc`; this keeps the declared size in sync.
              storage: 40Gi
  ingress:
    enabled: false

# Grafana configuration
grafana:
  # Admin credentials come from an installation-managed secret, NOT the well-known
  # `prom-operator` default: a publicly exposed Grafana must never accept the default
  # password. The local login form is also disabled below -- humans authenticate via
  # the identity provider (Keycloak).
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  envFromSecret: grafana-oidc-secret
  grafana.ini:
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      client_id: grafana
      scopes: openid profile email
      role_attribute_path: contains(groups[*], 'admin') && 'GrafanaAdmin' || contains(groups[*], 'editor') && 'Editor' || 'Viewer'
      allow_assign_grafana_admin: true
      allow_sign_up: true
    auth:
      # Grafana is public. Disable the local username/password form so the only human
      # login path is single sign-on; this neutralises the admin password for browser
      # logins (it remains for internal/API use).
      disable_login_form: true
  # Additional datasources (Loki for logs, Tempo for traces)
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc:3100
      jsonData:
        maxLines: 1000
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc:3100
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
        tracesToMetrics:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        lokiSearch:
          datasourceUid: loki
  ingress:
    enabled: false

# Alertmanager configuration
alertmanager:
  alertmanagerSpec:
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
    # Mount the slack-webhook-alerts secret
    secrets:
      - slack-webhook-alerts
      # Bearer token for the website backend's alert webhook (review finding W2)
      - website-webhook-token
    # Persistent storage
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: hcloud-volumes
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
  ingress:
    enabled: false
  config:
    receivers:
      - name: 'default-receiver'
      - name: 'slack'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook-alerts/webhook-url
            channel: '#alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: >-
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Severity:* {{ .Labels.severity }}
              {{ end }}
      - name: 'backend-webhook'
        webhook_configs:
          - url: 'http://website-backend.website.svc:8080/api/v1/alerts/webhook'
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/website-webhook-token/token
    route:
      receiver: 'default-receiver'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Watchdog is Prometheus' always-firing dead-man's switch. Routed down
        # the backend path ONLY (no `continue`, so it never reaches the Slack
        # receiver) so that it traverses the whole delivery chain: backend
        # webhook -> event stream -> slack-bot -> the operations agent, which
        # records each arrival as a heartbeat and alerts when they STOP. Alerts
        # reaching Slack directly cannot show that this branch is broken;
        # absence of a signal is only detectable if the signal is continuous.
        #
        # repeat_interval drives the heartbeat cadence; the consumer's freshness
        # window must stay comfortably larger. The observed cadence is ~10m, not
        # 5m: Alertmanager only re-notifies at group_interval ticks, and at the
        # 5m tick the elapsed time is exactly repeat_interval, so it slips to the
        # next one. Lower group_interval if more margin is wanted.
        #
        # Both consumers (the website backend and the slack-bot) special-case
        # Watchdog so it is not shown as an ordinary alert: enable this route
        # only after they do.
        - receiver: 'backend-webhook'
          matchers:
            - alertname="Watchdog"
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 5m
        - receiver: 'slack'
          matchers:
            - severity=~"warning|critical"
          # Fall through to sibling receivers so the website backend ALSO
          # sees the alert (the webhook publishes to the Redis stream that the
          # slack-bot's alert consumer fans out to the operations agent).
          # Without `continue: true` on this route, alerts stop after the
          # Slack post and the operations agent never sees real incidents.
          continue: true
        - receiver: 'backend-webhook'
          matchers:
            - severity=~"warning|critical"
          continue: true

# Enable all kube components (Talos exposes these)
kubeEtcd:
  enabled: true
kubeControllerManager:
  enabled: true
kubeScheduler:
  enabled: true
kubeProxy:
  enabled: false  # Cilium replaces kube-proxy

# Default alerting rules. We disable two stock rules that flap on transient,
# self-healing conditions and re-add tuned copies under
# platform/observability/alerts/ that only fire on sustained problems:
#
#   NodeMemoryMajorPagesFaults -- flaps on whichever worker carries the
#   observability stack (Prometheus + Loki) near its memory ceiling: the major
#   page-fault rate oscillates across the stock 500/s threshold during TSDB
#   compaction and Loki chunk flushes. Tuned copy: node-memory-alerts.yaml
#   (>1000/s for 30m).
#
#   KubeAggregatedAPIDown -- flaps when a node briefly restarts (the aggregated
#   metrics API goes unreachable for ~10-15m while Cilium/metrics-server recover).
#   Tuned copy: apiserver-alerts.yaml (for: 20m).
defaultRules:
  disabled:
    NodeMemoryMajorPagesFaults: true
    KubeAggregatedAPIDown: true

# Node exporter for host-level metrics
nodeExporter:
  enabled: true
prometheus-node-exporter:
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 64Mi

# Kube-state-metrics
kube-state-metrics:
  prometheus:
    monitor:
      http:
        # A kube-state-metrics series describes a Kubernetes object, not the exporter pod
        # that serves it. With honorLabels a series keeps its own labels (kube_pod_* keep
        # their pod and container, a namespaced object keeps its namespace), and the target
        # adds only what the series lacks: the exporter's pod, container and namespace.
        honorLabels: true
        # The target's pod and container are always the exporter's, so they go. A series
        # with its own pod or container keeps it.
        relabelings:
          - action: labeldrop
            regex: pod|container
        # The target's namespace is the exporter's too, but `up` and the scrape series
        # need it (TargetDown groups by namespace). It is cleared only on the families of
        # the cluster-scoped objects the chart collects, which never carry their own.
        # kube_namespace_* is not one of them: its namespace label is its own. The group
        # does not capture, so an empty replacement and the default "$1" both clear it.
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: kube_(?:certificatesigningrequest|mutatingwebhookconfiguration|node|persistentvolume|storageclass|validatingwebhookconfiguration|volumeattachment)_.+
            targetLabel: namespace
            replacement: ""
            action: replace
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 20m
      memory: 64Mi
